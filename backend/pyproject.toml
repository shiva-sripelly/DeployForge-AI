[project]
name = "deployforge-backend"
version = "0.1.0"
description = "DeployForge AI backend API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::sqlalchemy.exc.SAWarning",
  # Starlette suggests a different HTTP client for TestClient; httpx remains supported.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI dependency injection uses calls in defaults
  "SIM300",  # flags set-subset comparisons (A <= B) as Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
