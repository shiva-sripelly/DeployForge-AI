name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deployforge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: deployforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deployforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://deployforge:ci_only_password@127.0.0.1:5432/deployforge
      TEST_DATABASE_URL: postgresql+psycopg://deployforge:ci_only_password@127.0.0.1:5432/deployforge_test
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-outside-github-actions
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Apply migrations to a fresh database
        run: alembic upgrade head
      - name: Seed script is idempotent
        run: python -m app.scripts.seed_dev && python -m app.scripts.seed_dev
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
